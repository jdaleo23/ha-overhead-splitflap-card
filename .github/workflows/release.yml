name: Attach card to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    name: Upload card file
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Upload overhead-splitflap-card.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" overhead-splitflap-card.js --clobber --repo "$GITHUB_REPOSITORY"
